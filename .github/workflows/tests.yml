# Corre las pruebas en cada cambio: las normales (sin base de datos) y las de
# PostgreSQL real (scripts SQL, CRUD con Sequelize y migración de datos).
name: Pruebas

on:
  push:
  pull_request:

jobs:
  pruebas:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: visag
          POSTGRES_PASSWORD: visag_ci
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Pruebas sin base de datos
        run: npm test
      - name: Pruebas con PostgreSQL
        run: npm run test:db
        env:
          TEST_DATABASE_URL: postgresql://visag:visag_ci@localhost:5432/postgres
